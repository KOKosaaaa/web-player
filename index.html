<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src blob:; img-src 'self' data:;">
<title>Плеер</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0b0b0f;
  --sf: #131318;
  --sf2: #1a1a22;
  --bd: #25252f;
  --ac: #6c5ce7;
  --ac2: #a29bfe;
  --ac-glow: rgba(108,92,231,.2);
  --tx: #e8e8f0;
  --tx2: #8888a0;
  --tx3: #55556a;
  --red: #ff6b6b;
  --grn: #51cf66;
  --org: #ffa94d;
  --radius: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--tx); font-family:'Manrope',sans-serif; font-size:13px; }

.app { display:flex; flex-direction:column; height:100vh; }

/* ═══ HEADER ═══ */
.header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--sf);
  flex-shrink: 0;
  gap: 10px;
}
.logo {
  font-size: .95rem;
  font-weight: 800;
  letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.header-btns { display:flex; gap:6px; flex-shrink:0; }
.hbtn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: .65rem;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid;
  white-space: nowrap;
  transition: all .15s;
  background: none;
  color: var(--tx);
}
.hbtn-add { border-color: var(--ac); color: var(--ac2); }
.hbtn-add:hover { background: var(--ac-glow); }
.hbtn-stop { border-color: rgba(255,107,107,.3); color: var(--red); }
.hbtn-stop:hover { background: rgba(255,107,107,.08); }
.hbtn-trim { border-color: rgba(81,207,102,.3); color: var(--grn); }
.hbtn-trim:hover { background: rgba(81,207,102,.08); }

/* ═══ MAIN ═══ */
.main { flex:1; display:flex; overflow:hidden; }
.main.editor-open .playlist { flex:1; }
.main.editor-open .editor-panel { flex:1.1; }

/* ═══ PLAYLIST ═══ */
.playlist { flex:1; overflow-y:auto; padding:8px; -webkit-overflow-scrolling:touch; }
.track-list { max-width:760px; margin:0 auto; }

/* Empty state */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height: 60vh; gap: 16px; text-align:center;
}
.empty-icon {
  width:80px; height:80px; border-radius:50%;
  background: var(--sf2); border:2px dashed var(--bd);
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; color:var(--tx3);
}
.empty-title { font-size:1rem; font-weight:700; color:var(--tx2); }
.empty-sub { font-size:.75rem; color:var(--tx3); max-width:280px; }

/* Track card */
.track {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  margin-bottom: 4px;
  overflow: hidden;
  transition: all .15s;
}
.track:hover { background: var(--sf2); }
.track.active {
  background: #12111e;
  border-color: var(--ac);
  box-shadow: 0 0 16px var(--ac-glow);
}
.track.paused {
  border-color: var(--org);
  box-shadow: 0 0 12px rgba(255,169,77,.12);
}

.track-main {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  gap: 8px;
  user-select: none;
}
.track-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: .6rem;
  font-weight: 600;
  color: var(--tx3);
  min-width: 20px; height:20px;
  display:flex; align-items:center; justify-content:center;
  border-radius: 5px;
  background: rgba(255,255,255,.03);
  flex-shrink: 0;
}
.track.active .track-num { color: var(--ac2); background: rgba(108,92,231,.1); }

.play-btn {
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--bd);
  background: rgba(255,255,255,.02);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer; transition: all .12s;
}
.play-btn svg { width:11px; height:11px; fill:var(--tx3); }
.play-btn:hover svg { fill:var(--ac2); }
.track.active .play-btn { border-color:var(--ac); background:var(--ac); }
.track.active .play-btn svg { fill:#fff; }

.track-info { flex:1; min-width:0; }
.track-title {
  font-weight: 700; font-size: .75rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.3;
}
.track-desc {
  font-size: .6rem; color:var(--tx2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Waveform bars */
.wave-bars { display:none; gap:2px; align-items:flex-end; height:12px; flex-shrink:0; }
.track.active .wave-bars { display:flex; }
.wave-bar {
  width:2.5px; border-radius:1px; background:var(--ac2);
  animation: wave .8s ease-in-out infinite;
}
.wave-bar:nth-child(1){height:4px}
.wave-bar:nth-child(2){height:10px;animation-delay:.15s}
.wave-bar:nth-child(3){height:6px;animation-delay:.3s}
.wave-bar:nth-child(4){height:12px;animation-delay:.1s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}

.track-time {
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem; color:var(--tx3);
  flex-shrink:0; text-align:right; min-width:36px;
}
.track.active .track-time { color:var(--ac2); }

/* Action buttons row */
.track-actions {
  display:flex; gap:4px; flex-shrink:0;
}
.ibtn {
  background:none; border:1px solid var(--bd); color:var(--tx3);
  font-size:.7rem; width:34px; height:30px; border-radius:6px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .1s;
}
.ibtn:hover { border-color:var(--ac); color:var(--ac2); background:rgba(108,92,231,.06); }
.ibtn-up:hover, .ibtn-down:hover { border-color:var(--org); color:var(--org); background:rgba(255,169,77,.06); }
.ibtn-del:hover { border-color:var(--red); color:var(--red); background:rgba(255,107,107,.06); }
.ibtn-trim:hover { border-color:var(--grn); color:var(--grn); background:rgba(81,207,102,.06); }
.ibtn.active-trim { border-color:var(--grn); color:var(--grn); }

/* Progress bar */
.progress-wrap { padding:0 10px 4px; }
.progress-slider {
  -webkit-appearance:none; width:100%; height:4px;
  background:rgba(255,255,255,.08); border-radius:2px;
  outline:none; cursor:pointer;
}
.progress-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px;
  background:#fff; border-radius:50%;
  box-shadow:0 0 6px var(--ac-glow); cursor:pointer; margin-top:-5px;
}
.progress-slider::-moz-range-thumb {
  width:14px; height:14px; background:#fff; border-radius:50%;
  box-shadow:0 0 6px var(--ac-glow); border:none; cursor:pointer;
}
.progress-slider::-webkit-slider-runnable-track {
  height:4px; background:linear-gradient(90deg,var(--ac),var(--ac2)); border-radius:2px;
}
.progress-slider::-moz-range-track { height:4px; background:rgba(255,255,255,.08); border-radius:2px; }
.progress-slider::-moz-range-progress { height:4px; background:linear-gradient(90deg,var(--ac),var(--ac2)); border-radius:2px; }

/* Controls row */
.track-controls {
  display:flex; align-items:center; padding:0 10px 6px; gap:0;
}
.skip-btn {
  font-family:'IBM Plex Mono',monospace; font-size:.65rem; font-weight:600;
  color:var(--tx3); background:rgba(255,255,255,.03); border:1px solid var(--bd);
  padding:5px 11px; border-radius:5px; cursor:pointer; transition:all .1s;
  margin-right:3px;
}
.skip-btn:hover { color:var(--ac2); border-color:var(--ac); }
.vol-slider {
  -webkit-appearance:none; width:60px; height:3px;
  background:rgba(255,255,255,.1); border-radius:2px; outline:none; cursor:pointer;
  margin-left:auto;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:10px; height:10px;
  background:var(--ac2); border-radius:50%; cursor:pointer;
}
.vol-slider::-moz-range-thumb { width:10px; height:10px; background:var(--ac2); border-radius:50%; border:none; }
.fade-btn {
  font-family:'IBM Plex Mono',monospace; font-size:.65rem; font-weight:600;
  color:var(--tx3); background:rgba(255,255,255,.03); border:1px solid var(--bd);
  padding:5px 12px; border-radius:5px; cursor:pointer; margin-left:6px; transition:all .1s;
}
.fade-btn:hover { color:var(--org); border-color:var(--org); }
.loop-btn {
  font-family:'IBM Plex Mono',monospace; font-size:.75rem; font-weight:600;
  color:var(--tx3); background:rgba(255,255,255,.03); border:1px solid var(--bd);
  width:28px; height:28px; border-radius:5px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-left:5px; transition:all .1s;
}
.loop-btn:hover { color:var(--ac2); border-color:var(--ac); }
.loop-btn.on { color:var(--ac2); border-color:var(--ac); background:var(--ac-glow); }
.import-status {
  padding:6px 12px; background:var(--sf2); border-bottom:1px solid var(--bd);
  font-size:.7rem; font-family:'IBM Plex Mono',monospace; color:var(--ac2);
  text-align:center; flex-shrink:0;
}
.reset-btn {
  font-size:.75rem; color:var(--tx3); background:rgba(255,255,255,.03);
  border:1px solid var(--bd); width:28px; height:28px; border-radius:5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  margin-left:5px; transition:all .1s;
}
.reset-btn:hover { color:var(--red); border-color:var(--red); }

/* ═══ DRAG & DROP (custom, animated) ═══ */
.track-list { position: relative; }
/* Курсор: «хватаемый», во время удержания — «схвачено». .track-main отдельно
   потому что хотим оставить normal cursor над кнопками внутри. */
.track-main { cursor: grab; }
.track.drag-active .track-main { cursor: grabbing; }
/* Поднятый трек: над всеми остальными, с тенью, без transition (следует за курсором real-time). */
.track.drag-active {
  z-index: 100;
  box-shadow: 0 16px 38px rgba(0,0,0,.55), 0 0 0 1px var(--ac);
  transition: box-shadow .18s ease, background .15s;
}
/* Плавное смещение соседей и snap-анимация при отпускании. */
.track.drag-shift { transition: transform .22s cubic-bezier(.22,.7,.3,1); }
/* Слайдеры не должны провоцировать drag родителя. */
.progress-slider, .vol-slider { -webkit-user-drag: none; user-select: none; }

/* ═══ EDITOR PANEL ═══ */
.editor-panel {
  flex:0; width:0; overflow:hidden;
  border-left:1px solid var(--bd);
  background:var(--sf);
  display:flex; flex-direction:column;
  transition: flex .2s;
}
.editor-panel.open { flex:1.1; width:auto; overflow:visible; }

.editor-header {
  padding:8px 12px; border-bottom:1px solid var(--bd);
  display:flex; align-items:center; justify-content:space-between;
}
.editor-label {
  font-weight:700; font-size:.75rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.editor-header-btns { display:flex; gap:5px; }
.editor-btn-reset {
  font-family:'IBM Plex Mono',monospace; font-size:.55rem; font-weight:600;
  padding:4px 8px; border-radius:4px; cursor:pointer;
  border:1px solid var(--bd); background:none; color:var(--tx2); transition:all .1s;
}
.editor-btn-reset:hover { border-color:var(--ac); color:var(--ac2); }
.editor-btn-close {
  font-size:.75rem; padding:4px 8px; border-radius:4px; cursor:pointer;
  border:1px solid var(--bd); background:none; color:var(--tx2); transition:all .1s;
  line-height:1;
}
.editor-btn-close:hover { border-color:var(--red); color:var(--red); }

.editor-empty {
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--tx3); font-size:.75rem;
}
.editor-body { display:none; flex-direction:column; flex:1; overflow:hidden; padding:8px 12px; gap:8px; }

/* Waveform area */
.wave-outer { flex:1; min-height:80px; display:flex; flex-direction:column; gap:2px; }
.wave-times-top { display:flex; justify-content:space-between; }
.wave-times-top span, .wave-times-bottom span {
  font-family:'IBM Plex Mono',monospace; font-size:.55rem; color:var(--tx3);
}
.wave-area {
  flex:1; position:relative; background:var(--bg);
  border:1px solid var(--bd); border-radius:6px; overflow:hidden; cursor:crosshair;
  min-height:60px;
}
.wave-area.zoomed { cursor:grab; }
.wave-inner { position:relative; width:100%; height:100%; }
.wave-canvas { display:block; width:100%; height:100%; }
.dim-left, .dim-right { position:absolute; top:0; bottom:0; background:rgba(0,0,0,.55); pointer-events:none; }
.dim-left { left:0; }
.dim-right { right:0; }
.range-sel {
  position:absolute; top:0; bottom:0;
  border-top:2px solid var(--grn); border-bottom:2px solid var(--grn);
  pointer-events:none;
}
.handle-l, .handle-r {
  position:absolute; top:0; bottom:0; width:14px; cursor:ew-resize;
  pointer-events:all; z-index:2;
}
.handle-l { left:-7px; }
.handle-r { right:-7px; }
.handle-grip {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; gap:2px;
}
.handle-grip i { display:block; width:2px; height:8px; background:var(--grn); border-radius:1px; }
.playhead {
  position:absolute; top:0; bottom:0; width:2px; background:var(--ac2);
  display:none; z-index:3; pointer-events:none;
}
.zoom-label {
  position:absolute; bottom:4px; right:6px;
  font-family:'IBM Plex Mono',monospace; font-size:.5rem; color:var(--tx3);
  pointer-events:none; z-index:4;
}
.wave-times-bottom { display:flex; justify-content:space-between; }
.wave-times-bottom span { color:var(--grn); }

/* Editor info + buttons */
.editor-range {
  text-align:center; font-family:'IBM Plex Mono',monospace;
}
.editor-range .t { font-size:.7rem; color:var(--tx); }
.editor-range .d { font-size:.6rem; color:var(--tx2); margin-top:2px; }
.editor-btns { display:flex; gap:5px; flex-wrap:wrap; }
.ebtn {
  font-family:'IBM Plex Mono',monospace; font-size:.6rem; font-weight:600;
  padding:6px 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--bd); background:none; color:var(--tx2);
  transition:all .12s; flex:1; min-width:0; white-space:nowrap;
}
.ebtn:hover { background:var(--sf2); }
.ebtn-play { border-color:rgba(108,92,231,.3); color:var(--ac2); }
.ebtn-play:hover { background:rgba(108,92,231,.08); }
.ebtn-sel { border-color:rgba(255,169,77,.3); color:var(--org); }
.ebtn-sel:hover { background:rgba(255,169,77,.08); }
.ebtn-stop { border-color:rgba(255,107,107,.3); color:var(--red); }
.ebtn-stop:hover { background:rgba(255,107,107,.08); }
.ebtn-apply { border-color:rgba(81,207,102,.3); color:var(--grn); }
.ebtn-apply:hover { background:rgba(81,207,102,.08); }

.editor-hint {
  font-size:.55rem; color:var(--tx3); text-align:center;
}

/* Responsive */
@media (max-width:700px) {
  .main.editor-open { flex-direction:column; }
  .main.editor-open .playlist { flex:1; max-height:45vh; }
  .main.editor-open .editor-panel.open { flex:1; border-left:none; border-top:1px solid var(--bd); }
}

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--tx3); }

/* Path under track title */
.track-path {
  font-family: 'IBM Plex Mono', monospace;
  font-size: .65rem;
  color: var(--tx3);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
  text-align: left;
}
.track-path:before { content: '\1F4C1\00a0'; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">Плеер</div>
    <div class="header-btns">
      <button class="hbtn hbtn-add" onclick="addFiles()">+ Файлы</button>
      <button class="hbtn hbtn-add" onclick="addFolder()">+ Папка</button>
      <button class="hbtn hbtn-stop" onclick="stopAll()">&#9209; Стоп</button>
      <button class="hbtn hbtn-trim" onclick="toggleEditor()">&#9986; Нарезка</button>
    </div>
  </div>
  <div class="import-status" id="importStatus" style="display:none">Импорт...</div>
  <div class="main" id="main">
    <div class="playlist"><div class="track-list" id="trackList"></div></div>
    <div class="editor-panel" id="editorPanel">
      <div class="editor-header">
        <div class="editor-label" id="editorLabel">Нарезка</div>
        <div class="editor-header-btns">
          <button class="editor-btn-reset" onclick="editorReset()">&#8634; Сброс</button>
          <button class="editor-btn-close" onclick="toggleEditor()">&#10005;</button>
        </div>
      </div>
      <div class="editor-empty" id="editorEmpty">Нажмите &#9986; рядом с треком</div>
      <div class="editor-body" id="editorBody">
        <div class="wave-outer">
          <div class="wave-times-top"><span id="wtl">00:00.0</span><span id="wtr">00:00.0</span></div>
          <div class="wave-area" id="waveArea">
            <div class="wave-inner" id="waveInner">
              <canvas class="wave-canvas" id="waveCanvas"></canvas>
              <div class="dim-left" id="dimL" style="width:0"></div>
              <div class="dim-right" id="dimR" style="width:0"></div>
              <div class="range-sel" id="rangeSel" style="left:0;width:100%">
                <div class="handle-l" id="handleL"><div class="handle-grip"><i></i><i></i><i></i></div></div>
                <div class="handle-r" id="handleR"><div class="handle-grip"><i></i><i></i><i></i></div></div>
              </div>
              <div class="playhead" id="playhead"></div>
            </div>
            <div class="zoom-label" id="zoomLabel">x1.0</div>
          </div>
          <div class="wave-times-bottom"><span id="wbl">00:00.0</span><span id="wbr">00:00.0</span></div>
        </div>
        <div class="editor-range">
          <div class="t"><span id="edStart">00:00.0</span> &mdash; <span id="edEnd">00:00.0</span></div>
          <div class="d">Длительность: <span id="edDur">00:00.0</span></div>
        </div>
        <div class="editor-btns">
          <button class="ebtn ebtn-play" onclick="edPlayAll()">&#9654; Весь</button>
          <button class="ebtn ebtn-sel" onclick="edPlaySel()">&#9654; Выделение</button>
          <button class="ebtn ebtn-sel" onclick="edPlayPreview()">&#9654; Превью</button>
          <button class="ebtn ebtn-stop" onclick="edStop()">&#9632; Стоп</button>
          <button class="ebtn ebtn-apply" onclick="edApply()">&#10003; Создать нарезку</button>
        </div>
        <div class="editor-hint">Тяните зелёные ручки &#8596; для выделения | Колёсико — зум</div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="filePicker" accept="audio/*,.mp3,.wav,.ogg,.flac,.aac,.m4a,.m4b,.mp4,.webm,.opus,.wma,.aiff,.aif,.amr,.3gp,.ape,.alac,.mka,.ac3,.dts" multiple style="display:none">
<input type="file" id="folderPicker" webkitdirectory directory multiple style="display:none">

<script>
// ═══════════════════════════════
//  DATA
// ═══════════════════════════════
const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;

const MAX_FILE_SIZE = 300 * 1024 * 1024; // 300 МБ макс на файл
const ALLOWED_AUDIO_TYPES = ['audio/mpeg','audio/mp3','audio/wav','audio/wave','audio/x-wav','audio/ogg','audio/vorbis','audio/flac','audio/x-flac','audio/aac','audio/mp4','audio/x-m4a','audio/m4a','audio/webm','audio/opus','audio/x-ms-wma','audio/x-aiff','audio/aiff','audio/amr','audio/3gpp'];
// Принимаем по расширению, если MIME-тип пустой/неузнан (Windows часто отдаёт пустой type)
const AUDIO_EXTENSIONS = new Set(['mp3','wav','wave','ogg','oga','flac','aac','m4a','m4b','mp4','webm','opus','wma','aif','aiff','amr','3gp','3gpp','ape','alac','mka','caf','dts','ac3','tta','wv']);
function isLikelyAudio(file) {
  const t = (file.type || '').toLowerCase();
  if (t.startsWith('audio/') || ALLOWED_AUDIO_TYPES.includes(t)) return true;
  const name = (file.name || '').toLowerCase();
  const dot = name.lastIndexOf('.');
  if (dot < 0) return false;
  return AUDIO_EXTENSIONS.has(name.slice(dot + 1));
}

let tracks = []; // {id, title, src (objectURL), blob}
let audioCache = {};
let currentAudio = null, currentEl = null, currentIdx = null, animFrame = null;
let nextId = 1;
let playLock = false; // защита от гонки состояний

// ═══════════════════════════════
//  UTILS
// ═══════════════════════════════
// Санитизация строки для безопасной вставки в HTML
function esc(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Безопасное освобождение Object URL
function safeRevoke(url) {
  if (url && typeof url === 'string' && url.startsWith('blob:')) {
    try { URL.revokeObjectURL(url); } catch(e) {}
  }
}

// Валидация индекса трека
function validIdx(i) { return Number.isInteger(i) && i >= 0 && i < tracks.length; }

// ═══════════════════════════════
//  ADD FILES
// ═══════════════════════════════
function addFiles() { document.getElementById('filePicker').click(); }
function addFolder() { document.getElementById('folderPicker').click(); }

let importing = false;
let importDone = 0, importTotal = 0;

function renderImportStatus() {
  const el = document.getElementById('importStatus');
  if (!el) return;
  if (!importing || importTotal === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = 'Подготовка треков... ' + importDone + ' / ' + importTotal;
}

// Декодирует исходный blob и пере-кодирует его в WAV.
// Это устраняет MP3/AAC encoder-priming, из-за которого первые ~26 мс «теряются»
// при воспроизведении через <audio>.
async function blobToWavBlob(blob, fileName) {
  const name = fileName || blob.name || '';
  const isWav = (blob.type && /wav/i.test(blob.type)) || /\.wav$/i.test(name);
  if (isWav) return blob; // уже WAV - перекодировать смысла нет
  const ab = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) throw new Error('AudioContext не поддерживается');
  const ctx = new Ctx();
  try {
    const buf = await ctx.decodeAudioData(ab);
    const wav = toWav(buf);
    return new Blob([wav], { type: 'audio/wav' });
  } finally {
    try { ctx.close(); } catch(e) {}
  }
}

// Общая обработка списка файлов (для filePicker и folderPicker)
async function processFileList(fileList) {
  if (importing) return; // защита от параллельного импорта
  importing = true;

  // (#4) Сортируем по пути с числовой коллацией, чтобы 02.mp3 шёл раньше 10.mp3
  const sorted = Array.from(fileList).sort((a, b) => {
    const pa = a.webkitRelativePath || a.name || '';
    const pb = b.webkitRelativePath || b.name || '';
    return pa.localeCompare(pb, undefined, { numeric: true, sensitivity: 'base' });
  });

  const skipped = [];
  const valid = [];
  for (const file of sorted) {
    if (!isLikelyAudio(file)) {
      if (!file.webkitRelativePath) skipped.push(file.name + ' (не аудио)');
      continue;
    }
    if (file.size > MAX_FILE_SIZE) {
      skipped.push(file.name + ' (>' + Math.round(MAX_FILE_SIZE/1024/1024) + ' МБ)');
      continue;
    }
    if (file.size === 0) {
      skipped.push(file.name + ' (пустой файл)');
      continue;
    }
    valid.push(file);
  }

  importDone = 0;
  importTotal = valid.length;
  renderImportStatus();

  try {
    for (const file of valid) {
      const title = file.name.replace(/\.[^.]+$/, '');
      let path = '';
      if (file.webkitRelativePath) {
        const parts = file.webkitRelativePath.split('/');
        parts.pop();
        path = parts.join('/');
      }
      let playable;
      try {
        // (#3) Перекодируем в WAV, чтобы первые миллисекунды не отрезались
        playable = await blobToWavBlob(file, file.name);
      } catch(e) {
        console.warn('Не удалось перекодировать в WAV:', file.name, e);
        playable = file; // фолбэк: оригинал, прайминг может остаться
      }
      tracks.push({
        id: nextId++,
        title,
        src: URL.createObjectURL(playable),
        blob: playable,
        path,
        loop: false
      });
      importDone++;
      renderImportStatus();
      render();
      // уступаем event-loop'у, чтобы UI не подвисал
      await new Promise(r => setTimeout(r, 0));
    }
  } finally {
    importing = false;
    importTotal = 0;
    renderImportStatus();
  }

  if (skipped.length) alert('Пропущены файлы:\n' + skipped.join('\n'));
  render();
  saveToDB();
}

document.getElementById('filePicker').addEventListener('change', function() {
  processFileList(this.files);
  this.value = '';
});

document.getElementById('folderPicker').addEventListener('change', function() {
  processFileList(this.files);
  this.value = '';
});

// ═══════════════════════════════
//  RENDER
// ═══════════════════════════════
function render() {
  const el = document.getElementById('trackList');
  if (tracks.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">&#9835;</div>
        <div class="empty-title">Плейлист пуст</div>
        <div class="empty-sub">Нажмите «+ Добавить» чтобы загрузить музыку с устройства</div>
      </div>`;
    return;
  }
  let h = '';
  tracks.forEach((t, i) => {
    const safeTitle = esc(t.title);
    h += `<div class="track" id="t${i}">
      <div class="track-main" onmousedown="onTrackMouseDown(event,${i})">
        <div class="track-num">${i + 1}</div>
        <div class="play-btn" id="pb${i}">${playIcon}</div>
        <div class="track-info">
          <div class="track-title">${safeTitle}</div>
          ${t.path ? `<div class="track-path">${esc(t.path)}</div>` : ''}
        </div>
        <div class="wave-bars"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
        <div class="track-time" id="tm${i}">--:--</div>
        <div class="track-actions">
          <div class="ibtn ibtn-up" onclick="event.stopPropagation();moveTrack(${i},-1)" title="Вверх">&#9650;</div>
          <div class="ibtn ibtn-down" onclick="event.stopPropagation();moveTrack(${i},1)" title="Вниз">&#9660;</div>
          <div class="ibtn ibtn-trim" onclick="event.stopPropagation();openEditor(${i})" title="Нарезка">&#9986;</div>
          <div class="ibtn ibtn-del" onclick="event.stopPropagation();removeTrack(${i})" title="Удалить">&#10005;</div>
        </div>
      </div>
      <div class="progress-wrap">
        <input type="range" class="progress-slider" id="ps${i}" min="0" max="1000" value="0" step="1">
      </div>
      <div class="track-controls">
        <div class="skip-btn" onclick="event.stopPropagation();seek(${i},-10)">-10</div>
        <div class="skip-btn" onclick="event.stopPropagation();seek(${i},-5)">-5</div>
        <div class="skip-btn" onclick="event.stopPropagation();seek(${i},5)">+5</div>
        <div class="skip-btn" onclick="event.stopPropagation();seek(${i},10)">+10</div>
        <input type="range" class="vol-slider" min="0" max="100" value="100" oninput="setVol(${i},this.value)">
        <div class="fade-btn" onclick="event.stopPropagation();fadeOut(${i})" title="Плавное затухание">Fade</div>
        <div class="loop-btn${t.loop ? ' on' : ''}" onclick="event.stopPropagation();toggleLoop(${i})" title="Зацикливание">&#x21bb;</div>
        <div class="reset-btn" onclick="event.stopPropagation();resetTrack(${i})" title="В начало">&#9198;</div>
      </div>
    </div>`;
  });
  el.innerHTML = h;

  // Bind sliders
  document.querySelectorAll('.progress-slider').forEach(s => {
    const i = +s.id.replace('ps', '');
    s.addEventListener('input', e => {
      if (!validIdx(i)) return;
      const a = getAudio(i);
      if (a && a.duration && isFinite(a.duration)) a.currentTime = (e.target.value / 1000) * a.duration;
    });
  });

  // Re-apply active state
  if (currentIdx !== null && validIdx(currentIdx)) {
    const te = document.getElementById('t' + currentIdx);
    if (te) {
      const a = audioCache[tracks[currentIdx].id];
      if (a && !a.paused) te.classList.add('active');
      else if (a && a.paused && a.currentTime > 0) { te.classList.add('active', 'paused'); }
    }
  }

  // Re-apply active-trim marker если редактор открыт для какого-то трека
  if (edIdx !== null && validIdx(edIdx)) {
    const trimBtn = document.querySelector('#t' + edIdx + ' .ibtn-trim');
    if (trimBtn) trimBtn.classList.add('active-trim');
  }

  // (#4) Длительности: и подгружаем для новых треков, и обновляем для уже
  // декодированных. До этого фикса при ре-рендере (drag/move/import) tm-элементы
  // создавались с «--:--», но loadedmetadata у кэшированного <audio> уже отработал —
  // длительность так и оставалась пустой.
  tracks.forEach((t, i) => {
    const a = getAudio(i);
    if (a && isFinite(a.duration) && a.duration > 0) {
      const tmEl = document.getElementById('tm' + i);
      if (tmEl) tmEl.textContent = fmtShort(a.duration);
    }
  });
}

// ═══════════════════════════════
//  AUDIO CACHE
// ═══════════════════════════════
function getAudio(i) {
  if (!validIdx(i)) return null;
  const t = tracks[i];
  if (!audioCache[t.id]) {
    const a = new Audio(t.src);
    a.preload = 'auto';
    a.loop = !!t.loop;
    // Слушатели ищут трек по id, а не по index, чтобы пережить drag/move без багов
    const findIdx = () => tracks.findIndex(tt => tt.id === t.id);
    a.addEventListener('loadedmetadata', () => {
      const ix = findIdx();
      if (ix < 0) return;
      const el = document.getElementById('tm' + ix);
      if (el && isFinite(a.duration)) el.textContent = fmtShort(a.duration);
    });
    a.addEventListener('ended', () => {
      const ix = findIdx();
      if (ix >= 0) onEnded(ix);
    });
    a.addEventListener('error', () => {
      console.warn('Ошибка загрузки аудио для трека', t.title);
    });
    audioCache[t.id] = a;
  }
  return audioCache[t.id];
}

// ═══════════════════════════════
//  PLAYBACK
// ═══════════════════════════════
function play(i) {
  if (!validIdx(i) || playLock) return;
  playLock = true;
  try {
    const t = tracks[i];
    const a = getAudio(i);
    const el = document.getElementById('t' + i);
    if (!a || !el) { playLock = false; return; }

    // Stop previous if different
    if (currentAudio && currentAudio !== a) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      if (currentEl && currentIdx !== null) {
        currentEl.classList.remove('active', 'paused');
        const pbEl = document.getElementById('pb' + currentIdx);
        if (pbEl) pbEl.innerHTML = playIcon;
        const psEl = document.getElementById('ps' + currentIdx);
        if (psEl) psEl.value = 0;
        if (currentAudio.duration && isFinite(currentAudio.duration)) {
          const tmEl = document.getElementById('tm' + currentIdx);
          if (tmEl) tmEl.textContent = fmtShort(currentAudio.duration);
        }
      }
      cancelAnimationFrame(animFrame);
    }

    if (a.paused) {
      a.play().catch(err => console.warn('Play error:', err));
      el.classList.remove('paused');
      el.classList.add('active');
      document.getElementById('pb' + i).innerHTML = pauseIcon;
      currentAudio = a; currentEl = el; currentIdx = i;
      animate(t.id, a);
    } else {
      a.pause();
      el.classList.add('paused');
      document.getElementById('pb' + i).innerHTML = playIcon;
      cancelAnimationFrame(animFrame);
    }
  } finally {
    playLock = false;
  }
}

// (Bug A) animate привязан к id трека и его audio-объекту напрямую, а не к индексу.
// Раньше при drag-reorder играющего трека RAF-цикл выходил (getAudio(старыйИндекс)
// возвращал чужой <audio> у которого paused=true), прогрессбар замирал.
function animate(trackId, a) {
  if (!a || a.paused || a.ended) return;
  const ix = tracks.findIndex(t => t.id === trackId);
  if (ix < 0) return; // трек удалили
  const p = document.getElementById('ps' + ix);
  const tm = document.getElementById('tm' + ix);
  if (p && a.duration && isFinite(a.duration)) p.value = (a.currentTime / a.duration) * 1000;
  if (tm && a.duration && isFinite(a.duration)) tm.textContent = fmtShort(a.duration - a.currentTime);
  animFrame = requestAnimationFrame(() => animate(trackId, a));
}

function onEnded(i) {
  const el = document.getElementById('t' + i);
  if (el) el.classList.remove('active', 'paused');
  const pb = document.getElementById('pb' + i);
  if (pb) pb.innerHTML = playIcon;
  const ps = document.getElementById('ps' + i);
  if (ps) ps.value = 0;
  cancelAnimationFrame(animFrame);
  currentAudio = null; currentEl = null; currentIdx = null;
}

function stopAll() {
  Object.values(audioCache).forEach(a => { a.pause(); a.currentTime = 0; });
  document.querySelectorAll('.track').forEach(e => e.classList.remove('active', 'paused'));
  document.querySelectorAll('[id^="pb"]').forEach(b => { if (/^pb\d+$/.test(b.id)) b.innerHTML = playIcon; });
  document.querySelectorAll('.progress-slider').forEach(p => p.value = 0);
  cancelAnimationFrame(animFrame);
  if (fadeInterval) { clearInterval(fadeInterval); fadeInterval = null; }
  currentAudio = null; currentEl = null; currentIdx = null;
}

function seek(i, sec) {
  if (!validIdx(i)) return;
  const a = getAudio(i);
  if (a && a.duration && isFinite(a.duration)) a.currentTime = Math.max(0, Math.min(a.duration, a.currentTime + sec));
}
function setVol(i, v) { if (!validIdx(i)) return; const a = getAudio(i); if (a) a.volume = Math.max(0, Math.min(1, v / 100)); }
function toggleLoop(i) {
  if (!validIdx(i)) return;
  tracks[i].loop = !tracks[i].loop;
  const a = audioCache[tracks[i].id];
  if (a) a.loop = !!tracks[i].loop;
  // визуально обновляем только конкретную кнопку, чтобы не дёргать весь render()
  const btn = document.querySelector('#t' + i + ' .loop-btn');
  if (btn) btn.classList.toggle('on', !!tracks[i].loop);
  saveToDB();
}
function resetTrack(i) {
  if (!validIdx(i)) return;
  const a = getAudio(i);
  if (!a) return;
  const p = document.getElementById('ps' + i);
  if (p) p.value = 0;
  if (a.readyState > 0) a.currentTime = 0;
}

// ═══════════════════════════════
//  FADE OUT
// ═══════════════════════════════
let fadeInterval = null;
function fadeOut(i) {
  if (!validIdx(i)) return;
  const a = getAudio(i);
  if (!a || a.paused || fadeInterval) return;
  const startVol = a.volume, steps = 40, stepTime = 50;
  let step = 0;
  fadeInterval = setInterval(() => {
    step++;
    a.volume = Math.max(0, startVol * (1 - step / steps));
    if (step >= steps) {
      clearInterval(fadeInterval); fadeInterval = null;
      a.pause(); a.currentTime = 0; a.volume = startVol;
      onEnded(i);
    }
  }, stepTime);
}

// ═══════════════════════════════
//  MOVE / REMOVE
// ═══════════════════════════════
function moveTrack(i, dir) {
  const j = i + dir;
  if (!validIdx(i) || !validIdx(j)) return;
  let wasActive = currentIdx;
  [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
  if (wasActive === i) currentIdx = j;
  else if (wasActive === j) currentIdx = i;
  render();
  saveToDB();
}

// ═══════════════════════════════
//  DRAG & DROP REORDER (custom, animated)
// ═══════════════════════════════
// Зачем не HTML5 DnD: он не даёт плавно двигать соседей и аккуратно «припарковать»
// карточку на новое место. Поэтому считаем всё сами через mousedown/mousemove/mouseup.
// Логика: захватываем строку, далее transform: translateY следит за курсором, а соседи
// между source и текущей целью смещаются на rowSize (CSS transition сглаживает шаг).
// На mouseup анимируем карточку в финальную позицию и затем коммитим перестановку.
// Auto-scroll: пока курсор у верхнего/нижнего края playlist'а — он скроллится сам,
// transform поднятой карточки пересчитывается с учётом scrollDelta.
let dragState = null;
let autoScrollRaf = null;
let autoScrollSpeed = 0;
let lastDragEv = null;
// (Bug D) хранит pending snap-анимацию предыдущего drop'а. Если пользователь
// начнёт новый drag в течение 220мс snap-окна, мы коммитим прошлый сразу,
// иначе его отложенный resetAllDragStyles сотрёт inline-стили нового drag'а.
let pendingCommit = null;
const DRAG_THRESHOLD = 6; // пикселей, чтобы отличить клик от перетаскивания
const AUTOSCROLL_EDGE = 56;  // px от края playlist'а, где начинается прокрутка
const AUTOSCROLL_MAX = 16;   // максимальная скорость в px/frame

function onTrackMouseDown(e, i) {
  if (e.button !== 0) return;                 // только левая кнопка
  if (!validIdx(i)) return;
  if (importing) return;                       // во время импорта не дёргаемся
  if (dragState) return;                       // уже идёт drag
  // Кликнули на интерактивный элемент внутри строки - drag не запускаем,
  // пусть его собственный обработчик отработает нормально.
  if (e.target.closest &&
      e.target.closest('.ibtn,.skip-btn,.fade-btn,.loop-btn,.reset-btn,.progress-slider,.vol-slider,input,button')) {
    return;
  }
  // Если ещё висит snap предыдущего drop'а - закрываем его прямо сейчас,
  // чтобы его resetAllDragStyles не стёр inline-transform'ы нового drag'а.
  if (pendingCommit) {
    clearTimeout(pendingCommit.timeout);
    const s = pendingCommit.state;
    pendingCommit = null;
    commitDrag(s);
  }
  e.preventDefault(); // блокируем выделение текста и стандартный mouse-drag

  const playlist = document.querySelector('.playlist');
  dragState = {
    srcIdx: i,
    srcId: tracks[i].id,
    startY: e.clientY,
    startX: e.clientX,
    moved: false,
    el: null,
    rowSize: 0,
    gapIdx: i,
    playlistEl: playlist,
    startScrollTop: playlist ? playlist.scrollTop : 0,
  };
  window.addEventListener('mousemove', onWindowMouseMove);
  window.addEventListener('mouseup', onWindowMouseUp);
  window.addEventListener('blur', cancelDrag);
}

function initActiveDrag() {
  const el = document.getElementById('t' + dragState.srcIdx);
  if (!el) { cancelDrag(); return false; }
  const rect = el.getBoundingClientRect();
  const styles = getComputedStyle(el);
  const mb = parseFloat(styles.marginBottom) || 0;
  dragState.el = el;
  dragState.rowSize = rect.height + mb;
  dragState.moved = true;
  el.classList.add('drag-active');
  // На всех остальных треках включаем плавный transition для смещения
  document.querySelectorAll('.track-list .track').forEach(x => {
    if (x !== el) x.classList.add('drag-shift');
  });
  // Любой scroll playlist'а (колесо, scrollbar, программный auto-scroll)
  // должен пересчитать transform поднятой карточки — иначе она «отстаёт» от курсора.
  if (dragState.playlistEl) {
    dragState.playlistEl.addEventListener('scroll', onPlaylistScroll, { passive: true });
  }
  return true;
}

function onPlaylistScroll() {
  refreshDragVisual();
}

// Применяет transform к поднятой карточке и пересчитывает gap. Используется и из
// mousemove, и из auto-scroll цикла (когда курсор стоит, а playlist всё равно ползёт).
function refreshDragVisual() {
  if (!dragState || !dragState.moved || !lastDragEv) return;
  if (!document.contains(dragState.el)) { cancelDrag(); return; }
  const scrollDelta = (dragState.playlistEl ? dragState.playlistEl.scrollTop : 0) - dragState.startScrollTop;
  const dy = lastDragEv.clientY - dragState.startY;
  const X = dy + scrollDelta; // эффективное смещение в DOM-координатах
  dragState.el.style.transform = 'translateY(' + X + 'px) scale(1.025)';
  let newGap = dragState.srcIdx + Math.round(X / dragState.rowSize);
  if (newGap < 0) newGap = 0;
  if (newGap > tracks.length - 1) newGap = tracks.length - 1;
  if (newGap !== dragState.gapIdx) {
    dragState.gapIdx = newGap;
    applyNeighborShifts();
  }
}

function onWindowMouseMove(e) {
  if (!dragState) return;
  lastDragEv = e;
  // До перехода в активный drag сверяемся по X в DOM-координатах (с учётом scroll)
  const scrollDelta = (dragState.playlistEl ? dragState.playlistEl.scrollTop : 0) - dragState.startScrollTop;
  const dy = e.clientY - dragState.startY;
  const X = dy + scrollDelta;
  if (!dragState.moved) {
    if (Math.abs(X) < DRAG_THRESHOLD && Math.abs(e.clientX - dragState.startX) < DRAG_THRESHOLD) return;
    if (!initActiveDrag()) return;
  }
  refreshDragVisual();
  updateAutoScroll(e);
}

function updateAutoScroll(e) {
  if (!dragState || !dragState.moved || !dragState.playlistEl) { autoScrollSpeed = 0; return; }
  const pl = dragState.playlistEl;
  const rect = pl.getBoundingClientRect();
  let speed = 0;
  if (e.clientY < rect.top + AUTOSCROLL_EDGE) {
    const k = Math.max(0, Math.min(1, (rect.top + AUTOSCROLL_EDGE - e.clientY) / AUTOSCROLL_EDGE));
    speed = -AUTOSCROLL_MAX * Math.pow(k, 1.4); // нелинейный ramp — у самого края быстрее
  } else if (e.clientY > rect.bottom - AUTOSCROLL_EDGE) {
    const k = Math.max(0, Math.min(1, (e.clientY - (rect.bottom - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE));
    speed = AUTOSCROLL_MAX * Math.pow(k, 1.4);
  }
  autoScrollSpeed = speed;
  if (speed !== 0 && !autoScrollRaf) {
    autoScrollRaf = requestAnimationFrame(autoScrollTick);
  }
}

function autoScrollTick() {
  autoScrollRaf = null;
  if (!dragState || !dragState.moved || autoScrollSpeed === 0 || !dragState.playlistEl) return;
  const pl = dragState.playlistEl;
  const before = pl.scrollTop;
  pl.scrollTop = Math.max(0, Math.min(pl.scrollHeight - pl.clientHeight, before + autoScrollSpeed));
  if (pl.scrollTop !== before) {
    // Курсор не двигался, но соседи под ним проехали - перерисовать поднятую карточку и gap.
    refreshDragVisual();
    autoScrollRaf = requestAnimationFrame(autoScrollTick);
  }
  // else: упёрлись в границу прокрутки - дальше двигать нечего, loop сам остановится
}

function stopAutoScroll() {
  if (autoScrollRaf) { cancelAnimationFrame(autoScrollRaf); autoScrollRaf = null; }
  autoScrollSpeed = 0;
}

function applyNeighborShifts() {
  const src = dragState.srcIdx;
  const gap = dragState.gapIdx;
  const rs = dragState.rowSize;
  const els = document.querySelectorAll('.track-list .track');
  els.forEach((el, i) => {
    if (i === src) return;
    let shift = 0;
    if (gap < src && i >= gap && i < src) shift = rs;        // соседи между новой позицией и src уезжают ВНИЗ
    else if (gap > src && i > src && i <= gap) shift = -rs;  // ...или ВВЕРХ если тащим вниз
    el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
  });
}

function onWindowMouseUp(e) {
  window.removeEventListener('mousemove', onWindowMouseMove);
  window.removeEventListener('mouseup', onWindowMouseUp);
  window.removeEventListener('blur', cancelDrag);
  stopAutoScroll();
  if (!dragState) return;
  if (dragState.playlistEl) dragState.playlistEl.removeEventListener('scroll', onPlaylistScroll);
  lastDragEv = null;

  if (!dragState.moved) {
    // Был просто клик без движения - играем. (Bug B) ищем трек по id, а не по индексу:
    // между mousedown и mouseup массив мог поменяться (например импорт продолжился),
    // и indexed lookup попал бы не в тот трек.
    const id = dragState.srcId;
    dragState = null;
    const ix = tracks.findIndex(t => t.id === id);
    if (ix >= 0) play(ix);
    return;
  }

  // Финальная snap-анимация: переводим карточку в позицию gap
  const finalDy = (dragState.gapIdx - dragState.srcIdx) * dragState.rowSize;
  // Включаем transition на самой карточке для плавной парковки
  dragState.el.classList.add('drag-shift');
  dragState.el.style.transform = 'translateY(' + finalDy + 'px) scale(1)';
  const saved = dragState;
  dragState = null;
  const t = setTimeout(() => { pendingCommit = null; commitDrag(saved); }, 220);
  pendingCommit = { state: saved, timeout: t };
}

function commitDrag(state) {
  const { srcIdx, srcId, gapIdx } = state;
  // По id находим актуальный индекс (вдруг список изменился во время анимации)
  const actualSrc = tracks.findIndex(t => t.id === srcId);
  if (actualSrc < 0) { resetAllDragStyles(); render(); return; }

  if (gapIdx !== actualSrc) {
    const playingId = (currentIdx !== null && validIdx(currentIdx)) ? tracks[currentIdx].id : null;
    const editingId = (edIdx !== null && validIdx(edIdx)) ? tracks[edIdx].id : null;
    const [moved] = tracks.splice(actualSrc, 1);
    let dst = gapIdx;
    if (dst > tracks.length) dst = tracks.length;
    tracks.splice(dst, 0, moved);
    if (playingId !== null) {
      const ix = tracks.findIndex(t => t.id === playingId);
      currentIdx = ix >= 0 ? ix : null;
    }
    if (editingId !== null) {
      const ix = tracks.findIndex(t => t.id === editingId);
      edIdx = ix >= 0 ? ix : null;
    }
    saveToDB();
  }
  resetAllDragStyles();
  render();
}

function resetAllDragStyles() {
  document.querySelectorAll('.track-list .track').forEach(el => {
    el.style.transform = '';
    el.classList.remove('drag-active', 'drag-shift');
  });
}

function cancelDrag() {
  stopAutoScroll();
  if (!dragState) return;
  if (dragState.playlistEl) dragState.playlistEl.removeEventListener('scroll', onPlaylistScroll);
  if (dragState.el) {
    dragState.el.classList.remove('drag-active');
    dragState.el.style.transform = '';
  }
  resetAllDragStyles();
  dragState = null;
  lastDragEv = null;
  window.removeEventListener('mousemove', onWindowMouseMove);
  window.removeEventListener('mouseup', onWindowMouseUp);
  window.removeEventListener('blur', cancelDrag);
}

function removeTrack(i) {
  if (!validIdx(i)) return;
  const t = tracks[i];
  // Освобождаем Object URL
  safeRevoke(t.src);
  if (audioCache[t.id]) { audioCache[t.id].pause(); delete audioCache[t.id]; }
  if (currentIdx === i) {
    // (Bug F) если этот трек ещё fade-out'ится - погасим интервал, иначе он
    // через пару секунд дёрнет onEnded() для уже несуществующего индекса
    // и обнулит стейт другого играющего трека.
    if (fadeInterval) { clearInterval(fadeInterval); fadeInterval = null; }
    currentAudio = null; currentEl = null; currentIdx = null;
    cancelAnimationFrame(animFrame);
  } else if (currentIdx !== null && currentIdx > i) currentIdx--;
  // Инвалидируем редактор если открыт для этого трека
  if (edIdx === i) {
    edIdx = null; edBuf = null;
    if (edAudio) { edAudio.pause(); edAudio = null; }
    // (Bug C) WAV-blob превью, созданный edPlayPreview, не отзывался при
    // удалении трека — был утечкой памяти и держал тяжёлый Blob.
    safeRevoke(edPreviewUrl); edPreviewUrl = null;
    cancelAnimationFrame(edAnimFrame);
    document.getElementById('editorBody').style.display = 'none';
    document.getElementById('editorEmpty').style.display = 'flex';
    document.getElementById('playhead').style.display = 'none';
  } else if (edIdx !== null && edIdx > i) { edIdx--; }
  tracks.splice(i, 1);
  render();
  saveToDB();
}

// ═══════════════════════════════
//  FORMAT
// ═══════════════════════════════
function fmtShort(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60), c = Math.floor(s % 60);
  return m + ':' + (c < 10 ? '0' : '') + c;
}
function fmtLong(s) {
  if (!isFinite(s) || s < 0) return '00:00.0';
  const m = Math.floor(s / 60), c = (s % 60).toFixed(1);
  return (m < 10 ? '0' : '') + m + ':' + (c < 10 ? '0' : '') + c;
}

// ═══════════════════════════════
//  EDITOR
// ═══════════════════════════════
let editorOpen = false;
let edBuf = null, edIdx = null, edAudio = null, edAnimFrame = null;
let edStart = 0, edEnd = 0, edDuration = 0;
let zoomLevel = 1, zoomOffset = 0;
let edPreviewUrl = null; // для отслеживания и освобождения

function toggleEditor() {
  editorOpen = !editorOpen;
  document.getElementById('editorPanel').classList.toggle('open', editorOpen);
  document.getElementById('main').classList.toggle('editor-open', editorOpen);
}

function openEditor(i) {
  if (!validIdx(i)) return;
  if (!editorOpen) toggleEditor();
  document.querySelectorAll('.ibtn-trim').forEach(b => b.classList.remove('active-trim'));
  const btn = document.querySelector('#t' + i + ' .ibtn-trim');
  if (btn) btn.classList.add('active-trim');

  document.getElementById('editorEmpty').style.display = 'none';
  document.getElementById('editorBody').style.display = 'flex';
  const t = tracks[i];
  document.getElementById('editorLabel').textContent = t.title; // textContent — безопасно

  edIdx = i; edStart = 0; edEnd = 0; edDuration = 0;
  zoomLevel = 1; zoomOffset = 0;
  if (edAudio) { edAudio.pause(); edAudio = null; }
  safeRevoke(edPreviewUrl); edPreviewUrl = null;
  edAudio = new Audio(t.src);
  edAudio.preload = 'auto';

  let ctx;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { alert('AudioContext не поддерживается'); return; }

  // (#1) Читаем bytes напрямую из Blob, минуя fetch(blob:...) — иначе CSP без
  // явного `connect-src blob:` может зарубить запрос и редактор молча не
  // открывался у некоторых треков. Передаём slice(0), потому что decodeAudioData
  // забирает ArrayBuffer (detaches) и оригинал стал бы непригоден для других нужд.
  // (Bug E) Запоминаем id текущей цели редактора. Если пользователь успел
  // переключиться на другой трек до того как этот декод завершится, выбрасываем
  // результат - иначе buf пришёл бы от трека A, а edIdx указывал бы на B.
  const targetId = t.id;
  const arrPromise = (t.blob && typeof t.blob.arrayBuffer === 'function')
    ? t.blob.arrayBuffer()
    : fetch(t.src).then(r => r.arrayBuffer());
  arrPromise
    .then(b => ctx.decodeAudioData(b.slice(0)))
    .then(d => {
      if (edIdx === null || !validIdx(edIdx) || tracks[edIdx].id !== targetId) return; // редактор переключили
      edBuf = d; edDuration = d.duration; edEnd = edDuration;
      drawWave(d); updateEditorUI();
    })
    .catch(err => {
      // если редактор уже переключили - тихо игнорируем ошибку этого декода
      if (edIdx !== null && validIdx(edIdx) && tracks[edIdx].id === targetId) {
        console.error('Ошибка декодирования аудио:', err);
        alert('Не удалось открыть для нарезки: «' + (t.title || '?') + '».\n'
            + 'Браузер не смог декодировать этот формат.');
      }
    })
    .finally(() => {
      try { ctx.close(); } catch(e) {}
    });
}

function drawWave(buf) {
  const area = document.getElementById('waveArea');
  const inner = document.getElementById('waveInner');
  const baseW = area.clientWidth, h = area.clientHeight;
  if (baseW <= 0 || h <= 0) return; // защита от нулевых размеров (панель ещё анимируется)
  const totalW = Math.max(1, Math.round(baseW * zoomLevel));
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  inner.style.width = totalW + 'px';
  const cv = document.getElementById('waveCanvas');
  cv.style.width = totalW + 'px';
  cv.style.height = h + 'px';
  cv.width = Math.round(totalW * dpr);
  cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0); // одна установка transform - чище чем scale поверх старого

  const data = buf.getChannelData(0);
  // (#1) Рисуем чёткие выровненные по сетке бары.
  // Старый код рисовал бары 0.4px шириной на нецелых координатах - antialiasing
  // делал их «крывыми» и эффект сильно зависел от формата (для коротких/мелких
  // декодированных буферов выглядело особенно плохо).
  const barW = 2, gap = 1, stride = barW + gap;
  const bars = Math.max(1, Math.floor(totalW / stride));
  const samplesPerBar = Math.max(1, Math.floor(data.length / bars));
  const stepSamp = Math.max(1, Math.floor(samplesPerBar / 32)); // шаг внутри блока: 32 точки на бар достаточно
  const mid = h / 2;
  c.clearRect(0, 0, totalW, h);

  for (let x = 0; x < bars; x++) {
    let mn = 0, mx = 0;
    const s = x * samplesPerBar;
    const end = Math.min(s + samplesPerBar, data.length);
    for (let j = s; j < end; j += stepSamp) {
      const v = data[j];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    const peak = Math.min(1, (mx - mn) * 0.5);
    const bh = Math.max(1, peak * h * 0.9);
    const alpha = 0.4 + Math.min(0.5, peak * 1.5);
    c.fillStyle = 'rgba(108,92,231,' + alpha + ')';
    c.fillRect(x * stride, Math.round(mid - bh / 2), barW, Math.round(bh));
  }
  applyZoomScroll();
}

// Перерисовываем волну, когда размер области меняется (открытие панели,
// resize окна, поворот экрана). Без этого первый draw мог попадать на
// промежуточный 0-px стейт во время CSS-transition'а.
if (window.ResizeObserver) {
  const _waveResize = new ResizeObserver(() => {
    if (edBuf && document.getElementById('editorPanel').classList.contains('open')) {
      drawWave(edBuf);
      updateEditorUI();
    }
  });
  _waveResize.observe(document.getElementById('waveArea'));
}
window.addEventListener('resize', () => {
  if (edBuf && document.getElementById('editorPanel').classList.contains('open')) {
    drawWave(edBuf);
    updateEditorUI();
  }
});

function applyZoomScroll() {
  const area = document.getElementById('waveArea');
  const inner = document.getElementById('waveInner');
  const baseW = area.clientWidth, totalW = baseW * zoomLevel;
  const maxOff = Math.max(0, (totalW - baseW) / totalW);
  zoomOffset = Math.max(0, Math.min(maxOff, zoomOffset));
  inner.style.transform = 'translateX(' + (-zoomOffset * totalW) + 'px)';
  document.getElementById('zoomLabel').textContent = 'x' + zoomLevel.toFixed(1);
  area.classList.toggle('zoomed', zoomLevel > 1);
}

function updateEditorUI() {
  if (edDuration <= 0) return; // защита от деления на ноль
  const pL = edStart / edDuration, pR = edEnd / edDuration;
  document.getElementById('rangeSel').style.left = (pL * 100) + '%';
  document.getElementById('rangeSel').style.width = ((pR - pL) * 100) + '%';
  document.getElementById('dimL').style.width = (pL * 100) + '%';
  document.getElementById('dimR').style.width = ((1 - pR) * 100) + '%';
  document.getElementById('wtl').textContent = fmtLong(0);
  document.getElementById('wtr').textContent = fmtLong(edDuration);
  document.getElementById('wbl').textContent = fmtLong(edStart);
  document.getElementById('wbr').textContent = fmtLong(edEnd);
  document.getElementById('edStart').textContent = fmtLong(edStart);
  document.getElementById('edEnd').textContent = fmtLong(edEnd);
  document.getElementById('edDur').textContent = fmtLong(edEnd - edStart);
}

function editorReset() {
  if (!edBuf) return;
  edStart = 0; edEnd = edDuration; zoomLevel = 1; zoomOffset = 0;
  drawWave(edBuf); updateEditorUI();
}

// Zoom via wheel
document.getElementById('waveArea').addEventListener('wheel', function(e) {
  if (!edBuf) return;
  e.preventDefault();
  const area = this;
  const rect = area.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const baseW = rect.width;
  const oldZ = zoomLevel;
  const scale = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomLevel = Math.max(1, Math.min(40, zoomLevel * scale));
  const frac = (zoomOffset * baseW * oldZ + mouseX) / (baseW * oldZ);
  zoomOffset = (frac * baseW * zoomLevel - mouseX) / (baseW * zoomLevel);
  drawWave(edBuf); updateEditorUI();
}, { passive: false });

// Pinch zoom for touch
let lastTouchDist = null;
document.getElementById('waveArea').addEventListener('touchstart', e => { if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive: true });
document.getElementById('waveArea').addEventListener('touchmove', function(e) {
  if (e.touches.length === 2 && edBuf && lastTouchDist) {
    e.preventDefault();
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const center = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const rect = this.getBoundingClientRect();
    const mouseX = center - rect.left;
    const baseW = rect.width;
    const oldZ = zoomLevel;
    const scale = dist / lastTouchDist;
    zoomLevel = Math.max(1, Math.min(40, zoomLevel * scale));
    const frac = (zoomOffset * baseW * oldZ + mouseX) / (baseW * oldZ);
    zoomOffset = (frac * baseW * zoomLevel - mouseX) / (baseW * zoomLevel);
    lastTouchDist = dist;
    drawWave(edBuf); updateEditorUI();
  }
}, { passive: false });

// Handle dragging
function makeHandle(handle, side) {
  function start(e) {
    e.preventDefault(); e.stopPropagation();
    const area = document.getElementById('waveArea');
    const move = ev => {
      ev.preventDefault();
      const rc = area.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const baseW = rc.width;
      const frac = (zoomOffset * baseW * zoomLevel + (cx - rc.left)) / (baseW * zoomLevel);
      let t = Math.max(0, Math.min(edDuration, frac * edDuration));
      if (side === 'l') edStart = Math.max(0, Math.min(t, edEnd - .05));
      else edEnd = Math.min(edDuration, Math.max(t, edStart + .05));
      updateEditorUI();
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up);
  }
  handle.addEventListener('mousedown', start);
  handle.addEventListener('touchstart', start, { passive: false });
}
makeHandle(document.getElementById('handleL'), 'l');
makeHandle(document.getElementById('handleR'), 'r');

// Click to seek in editor
let panStart = null, panStartOff = 0, panMoved = false;
const waveArea = document.getElementById('waveArea');
waveArea.addEventListener('mousedown', e => {
  if (!edBuf || e.target.closest('.handle-l,.handle-r') || zoomLevel <= 1) return;
  panStart = e.clientX; panStartOff = zoomOffset; panMoved = false;
  waveArea.style.cursor = 'grabbing';
  const mv = ev => { const dx = ev.clientX - panStart; if (Math.abs(dx) > 3) panMoved = true; const bw = waveArea.getBoundingClientRect().width; zoomOffset = panStartOff - dx / (bw * zoomLevel); applyZoomScroll(); updateEditorUI(); };
  const up = () => { waveArea.style.cursor = 'crosshair'; document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); panStart = null; };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});
waveArea.addEventListener('click', e => {
  if (!edBuf || e.target.closest('.handle-l,.handle-r') || panMoved) return;
  const rc = waveArea.getBoundingClientRect(); const bw = rc.width;
  const frac = (zoomOffset * bw * zoomLevel + (e.clientX - rc.left)) / (bw * zoomLevel);
  if (edAudio) edAudio.currentTime = Math.max(0, Math.min(edDuration, frac * edDuration));
});

// Editor playback
function edAnimateLoop(stopAt) {
  const ph = document.getElementById('playhead'); ph.style.display = 'block';
  cancelAnimationFrame(edAnimFrame);
  if (!edAudio || edDuration <= 0) return;
  (function s() {
    if (!edAudio || edAudio.paused || edAudio.ended || (stopAt && edAudio.currentTime >= stopAt)) {
      if (edAudio) edAudio.pause();
      ph.style.display = 'none'; return;
    }
    ph.style.left = (Math.max(0, Math.min(100, edAudio.currentTime / edDuration * 100))) + '%';
    edAnimFrame = requestAnimationFrame(s);
  })();
}
function edPlayAll() { if (!edAudio) return; edAudio.currentTime = 0; edAudio.play().catch(e => console.warn('EdPlay error:', e)); edAnimateLoop(null); }
function edPlaySel() { if (!edAudio || edEnd <= edStart) return; edAudio.currentTime = edStart; edAudio.play().catch(e => console.warn('EdPlaySel error:', e)); edAnimateLoop(edEnd); }
function edStop() { if (edAudio) { edAudio.pause(); edAudio.currentTime = 0; } document.getElementById('playhead').style.display = 'none'; cancelAnimationFrame(edAnimFrame); }

function edPlayPreview() {
  if (!edBuf || edEnd <= edStart || edDuration <= 0) return;
  const sr = edBuf.sampleRate, ch = edBuf.numberOfChannels;
  const s0 = Math.floor(edStart * sr), s1 = Math.floor(edEnd * sr), ln = s1 - s0;
  if (ln <= 0) return;
  let ofx;
  try { ofx = new OfflineAudioContext(ch, ln, sr); } catch(e) { return; }
  const nb = ofx.createBuffer(ch, ln, sr);
  for (let c = 0; c < ch; c++) { const s = edBuf.getChannelData(c), d = nb.getChannelData(c); for (let j = 0; j < ln; j++) d[j] = s[s0 + j]; }
  const src = ofx.createBufferSource(); src.buffer = nb; src.connect(ofx.destination); src.start();
  ofx.startRendering().then(rendered => {
    const wav = toWav(rendered), bl = new Blob([wav], { type: 'audio/wav' });
    // Освобождаем предыдущий превью URL
    safeRevoke(edPreviewUrl);
    edPreviewUrl = URL.createObjectURL(bl);
    if (edAudio) edAudio.pause();
    edAudio = new Audio(edPreviewUrl); edAudio.play().catch(e => console.warn('Preview play error:', e));
    const ph = document.getElementById('playhead'); ph.style.display = 'block';
    cancelAnimationFrame(edAnimFrame);
    const selDur = edEnd - edStart;
    if (selDur <= 0) return;
    (function s() {
      if (edAudio.paused || edAudio.ended) { ph.style.display = 'none'; return; }
      const pct = edStart / edDuration + (edAudio.currentTime / selDur) * ((edEnd - edStart) / edDuration);
      ph.style.left = (Math.max(0, Math.min(100, pct * 100))) + '%';
      edAnimFrame = requestAnimationFrame(s);
    })();
  }).catch(err => console.error('Preview render error:', err));
}

function edApply() {
  if (!edBuf || edEnd <= edStart || edDuration <= 0) { alert('Выделите область'); return; }
  if (edIdx === null || !validIdx(edIdx)) { alert('Трек не найден'); return; }
  const sr = edBuf.sampleRate, ch = edBuf.numberOfChannels;
  const s0 = Math.floor(edStart * sr), s1 = Math.floor(edEnd * sr), ln = s1 - s0;
  if (ln <= 0) { alert('Слишком короткий фрагмент'); return; }
  let ofx;
  try { ofx = new OfflineAudioContext(ch, ln, sr); } catch(e) { alert('Ошибка AudioContext'); return; }
  const nb = ofx.createBuffer(ch, ln, sr);
  for (let c = 0; c < ch; c++) { const s = edBuf.getChannelData(c), d = nb.getChannelData(c); for (let j = 0; j < ln; j++) d[j] = s[s0 + j]; }
  const src = ofx.createBufferSource(); src.buffer = nb; src.connect(ofx.destination); src.start();
  ofx.startRendering().then(r => {
    const wav = toWav(r), bl = new Blob([wav], { type: 'audio/wav' });
    const origTitle = tracks[edIdx].title;
    const newTitle = origTitle + ' (' + fmtLong(edStart) + '–' + fmtLong(edEnd) + ')';
    const newUrl = URL.createObjectURL(bl);
    const newTrack = { id: nextId++, title: newTitle, src: newUrl, blob: bl, path: tracks[edIdx].path || '' };
    // Вставляем новый трек сразу после оригинала
    tracks.splice(edIdx + 1, 0, newTrack);
    // Корректируем currentIdx если он сдвинулся
    if (currentIdx !== null && currentIdx > edIdx) currentIdx++;
    render();
    saveToDB();
    alert('Создан новый трек «' + esc(newTitle) + '»');
  }).catch(err => {
    console.error('Trim render error:', err);
    alert('Ошибка при нарезке');
  });
}

function toWav(buf) {
  const ch = buf.numberOfChannels, sr = buf.sampleRate, ln = buf.length;
  const out = new ArrayBuffer(44 + ln * ch * 2), v = new DataView(out);
  function w(p, s) { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); }
  w(0, 'RIFF'); v.setUint32(4, 36 + ln * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, ln * ch * 2, true);
  let off = 44;
  for (let i = 0; i < ln; i++) for (let c = 0; c < ch; c++) {
    let x = Math.max(-1, Math.min(1, buf.getChannelData(c)[i]));
    v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7FFF, true); off += 2;
  }
  return out;
}

// ═══════════════════════════════
//  IndexedDB persistence
// ═══════════════════════════════
function dbOpen() {
  return new Promise((ok, fail) => {
    if (!window.indexedDB) { fail(new Error('IndexedDB не поддерживается')); return; }
    const r = indexedDB.open('playerDB', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('tracks'); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fail(r.error);
  });
}
function saveToDB() {
  dbOpen().then(db => {
    const tx = db.transaction('tracks', 'readwrite');
    const store = tx.objectStore('tracks');
    store.clear();
    const saveData = tracks.map(t => ({ id: t.id, title: t.title, blob: t.blob, path: t.path || '', loop: !!t.loop }));
    store.put(saveData, 'playlist');
    tx.oncomplete = () => db.close();
    tx.onerror = () => { console.warn('IDB save error:', tx.error); db.close(); };
  }).catch(err => console.warn('IDB open error on save:', err));
}
function loadFromDB() {
  dbOpen().then(db => {
    const tx = db.transaction('tracks', 'readonly');
    const req = tx.objectStore('tracks').get('playlist');
    req.onsuccess = () => {
      db.close();
      const data = req.result;
      if (!data || !Array.isArray(data) || !data.length) { render(); return; }
      data.forEach(item => {
        // Валидация загруженных данных
        if (!item || !item.blob || typeof item.title !== 'string') return;
        try {
          const url = URL.createObjectURL(item.blob);
          tracks.push({ id: nextId++, title: item.title, src: url, blob: item.blob, path: item.path || '', loop: !!item.loop });
        } catch(e) { console.warn('Ошибка восстановления трека:', item.title, e); }
      });
      render();
    };
    req.onerror = () => { db.close(); render(); };
  }).catch(err => { console.warn('IDB open error on load:', err); render(); });
}

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
loadFromDB();
